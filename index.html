<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">StepShop — Повседневные новинки обуви</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col pb-24 sm:pb-0">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-shoe-prints text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">StepShop</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- Переключатель языков -->
                <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-gray-100 border border-gray-200 text-gray-700 text-xs sm:text-sm font-medium rounded-xl px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <option value="ru">Русский</option>
                    <option value="tm">Türkmençe</option>
                    <option value="en">English</option>
                </select>

                <!-- Корзина -->
                <button onclick="toggleCartModal()" class="relative bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium px-3.5 py-2 rounded-xl transition flex items-center space-x-1.5 text-xs sm:text-sm">
                    <i class="fa-solid fa-shopping-bag"></i>
                    <span data-i18n="cartBtn">Выбрано</span>
                    <span id="cartCountBadge" class="bg-indigo-600 text-white text-xs font-bold px-1.5 py-0.2 rounded-full ml-0.5">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Hero Banner -->
        <div class="bg-gradient-to-r from-indigo-900 to-indigo-700 rounded-2xl p-6 sm:p-8 text-white mb-8 shadow-lg">
            <h1 id="heroTitle" class="text-2xl sm:text-3xl font-extrabold mb-2">Новинки повседневной обуви</h1>
            <p id="heroDesc" class="text-indigo-100 text-sm sm:text-base max-w-xl mb-6">Отмечайте понравившиеся пары, выбирайте размеры и отправляйте весь заказ оптом прямо на почту в один клик!</p>
            
            <!-- Поиск и фильтры -->
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-grow">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Поиск модели..." class="w-full pl-10 pr-4 py-2.5 bg-white text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm shadow-inner">
                </div>
                <div class="flex gap-2 overflow-x-auto pb-1 sm:pb-0">
                    <button onclick="filterCategory('all', this)" data-cat="all" class="cat-btn px-4 py-2 bg-white text-indigo-900 font-medium rounded-xl text-sm whitespace-nowrap shadow hover:bg-indigo-50 transition active">Все</button>
                    <button onclick="filterCategory('men', this)" data-cat="men" class="cat-btn px-4 py-2 bg-indigo-800/80 text-white font-medium rounded-xl text-sm whitespace-nowrap shadow hover:bg-indigo-700 transition" data-i18n="catMen">Мужские</button>
                    <button onclick="filterCategory('women', this)" data-cat="women" class="cat-btn px-4 py-2 bg-indigo-800/80 text-white font-medium rounded-xl text-sm whitespace-nowrap shadow hover:bg-indigo-700 transition" data-i18n="catWomen">Женские</button>
                </div>
            </div>
        </div>

        <!-- Сетка товаров -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Мобильная плавающая панель -->
    <div id="mobileCartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-xl z-20 flex items-center justify-between sm:hidden">
        <div>
            <span class="text-xs text-gray-500 block" data-i18n="selectedModels">Выбрано моделей:</span>
            <span id="mobileCartCount" class="font-bold text-indigo-600 text-base">0 шт.</span>
        </div>
        <button onclick="toggleCartModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition flex items-center space-x-2">
            <i class="fa-solid fa-paper-plane"></i>
            <span data-i18n="sendList">Отправить список</span>
        </button>
    </div>

    <!-- Модальное окно корзины -->
    <div id="cartModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] flex flex-col">
            <button onclick="toggleCartModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <h3 id="modalHeaderTitle" class="text-lg font-bold text-gray-900 mb-1">Ваш выбор (Оптом)</h3>
            <p class="text-xs text-gray-500 mb-4">Email: <span class="font-semibold text-indigo-600">Adimayakgap1@gmail.com</span></p>

            <div id="cartItemsList" class="overflow-y-auto flex-grow space-y-3 my-2 pr-1 max-h-[50vh]"></div>

            <div class="pt-4 border-t border-gray-100 mt-auto">
                <button onclick="sendBulkEmail()" id="sendBulkBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-md flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span data-i18n="sendToEmail">Отправить все товары на почту</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Скрипты локализации и каталога -->
    <script>
        const myEmail = "Adimayakgap1@gmail.com";

        // Переводы интерфейса
        const translations = {
            ru: {
                pageTitle: "StepShop — Повседневные новинки обуви",
                heroTitle: "Новинки повседневной обуви",
                heroDesc: "Отмечайте понравившиеся пары, выбирайте размеры и отправляйте весь заказ оптом прямо на почту в один клик!",
                searchPlaceholder: "Поиск модели...",
                catAll: "Все",
                catMen: "Мужские",
                catWomen: "Женские",
                cartBtn: "Выбрано",
                selectSize: "Выберите размер:",
                addBtn: "Выбрать эту модель",
                addedBtn: "Добавлено в список",
                emptyCart: "Вы пока ничего не выбрали.<br>Нажмите «Выбрать эту модель» на товарах.",
                selectedModels: "Выбрано моделей:",
                sendList: "Отправить список",
                modalTitle: "Ваш выбор (Оптом)",
                sendToEmail: "Отправить все товары на почту",
                sizeText: "Размер",
                mailSubject: "Оптовый запрос цен",
                mailGreeting: "Здравствуйте! Мне понравились следующие модели, подскажите цены:\n\n"
            },
            tm: {
                pageTitle: "StepShop — Gündelik Aýakgap Täzelikleri",
                heroTitle: "Gündelik aýakgap täzelikleri",
                heroDesc: "Halaýan jübütleriňizi saýlaň, ölçegleri belläň we ähli sargytlary göni poçta bir basyşda iberiň!",
                searchPlaceholder: "Gözleg...",
                catAll: "Ählisi",
                catMen: "Erkekler üçin",
                catWomen: "Aýallar üçin",
                cartBtn: "Saýlanan",
                selectSize: "Ölçegi saýlaň:",
                addBtn: "Bu modeli saýlamaly",
                addedBtn: "Sanawda goşuldy",
                emptyCart: "Siz entäk hiç zat saýlamadyňyz.<br>Harytlarda «Bu modeli saýlamaly» düwmesine basyň.",
                selectedModels: "Saýlananlar:",
                sendList: "Sanawy ibermek",
                modalTitle: "Siziň saýlawyňyz",
                sendToEmail: "Ähli harytlary poçta ibermek",
                sizeText: "Ölçeg",
                mailSubject: "Bahalar barada sorag",
                mailGreeting: "Salam! Maňa aşakdaky modeller ýarady, bahalaryny aýdaýyň:\n\n"
            },
            en: {
                pageTitle: "StepShop — Casual Shoe New Arrivals",
                heroTitle: "Casual Shoe New Arrivals",
                heroDesc: "Select your favorite pairs, choose sizes, and send your wholesale inquiry directly to email in one click!",
                searchPlaceholder: "Search model...",
                catAll: "All",
                catMen: "Men",
                catWomen: "Women",
                cartBtn: "Selected",
                selectSize: "Select size:",
                addBtn: "Choose this model",
                addedBtn: "Added to list",
                emptyCart: "You haven't selected anything yet.<br>Click 'Choose this model' on items.",
                selectedModels: "Selected models:",
                sendList: "Send list",
                modalTitle: "Your Selection (Wholesale)",
                sendToEmail: "Send all items to email",
                sizeText: "Size",
                mailSubject: "Wholesale Price Inquiry",
                mailGreeting: "Hello! I liked the following models, please let me know the prices:\n\n"
            }
        };

        let currentLang = 'ru';

        // База товаров с вашими ссылками GitHub
        const products = [
            {
                id: 1,
                name: { ru: "Повседневные кеды Classic", tm: "Gündelik kedler Classic", en: "Casual Sneakers Classic" },
                category: "men",
                badge: { ru: "Новинка", tm: "Täze", en: "New" },
                image: "https://raw.githubusercontent.com/wlafwoolf-ctrl/school-schedule1/main/images/Kedy1.jpg", 
                sizes: ["40", "41", "42", "43", "44"]
            },
            {
                id: 2,
                name: { ru: "Стильная новинка Taze 2", tm: "Aýratyn täzelik Taze 2", en: "Stylish New Taze 2" },
                category: "men",
                badge: { ru: "Новинка", tm: "Täze", en: "New" },
                image: "https://raw.githubusercontent.com/wlafwoolf-ctrl/school-schedule1/main/images/Taze2.jpeg", 
                sizes: ["39", "40", "41", "42", "43"]
            },
            {
                id: 3,
                name: { ru: "Стильная новинка Taze 3", tm: "Aýratyn täzelik Taze 3", en: "Stylish New Taze 3" },
                category: "women",
                badge: { ru: "Хит", tm: "Meşhur", en: "Hit" },
                image: "https://raw.githubusercontent.com/wlafwoolf-ctrl/school-schedule1/main/images/Taze3.jpeg", 
                sizes: ["36", "37", "38", "39", "40"]
            }
        ];

        let cart = [];
        let currentFilter = 'all';

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('htmlRoot').setAttribute('lang', lang);
            document.getElementById('pageTitle').innerText = t.pageTitle;
            document.getElementById('heroTitle').innerText = t.heroTitle;
            document.getElementById('heroDesc').innerText = t.heroDesc;
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('modalHeaderTitle').innerText = t.modalTitle;

            // Перевод статических элементов интерфейса с атрибутом data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });

            // Перевод кнопок категорий
            document.querySelectorAll('.cat-btn').forEach(btn => {
                const cat = btn.getAttribute('data-cat');
                if (cat === 'all') btn.innerText = t.catAll;
                if (cat === 'men') btn.innerText = t.catMen;
                if (cat === 'women') btn.innerText = t.catWomen;
            });

            renderProducts(getFilteredProducts());
            updateCartUI();
        }

        function getFilteredProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            return products.filter(p => {
                const matchCat = currentFilter === 'all' || p.category === currentFilter;
                const nameInLang = p.name[currentLang].toLowerCase();
                const matchSearch = nameInLang.includes(search);
                return matchCat && matchSearch;
            });
        }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            const t = translations[currentLang];
            
            if(items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">Ничего не найдено / Hiç zat tapylmady</div>`;
                return;
            }

            items.forEach(p => {
                const isInCart = cart.some(item => item.product.id === p.id);
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden flex flex-col hover:shadow-md transition">
                        <div class="relative h-56 bg-gray-100 overflow-hidden">
                            <img src="${p.image}" alt="${p.name[currentLang]}" class="w-full h-full object-cover hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/400x300?text=GitHub+Image+Error'">
                            <span class="absolute top-3 left-3 bg-indigo-600 text-white text-xs font-semibold px-2.5 py-1 rounded-lg shadow">${p.badge[currentLang]}</span>
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <h3 class="font-bold text-gray-800 text-base mb-2">${p.name[currentLang]}</h3>
                            
                            <div class="mb-4">
                                <label class="text-xs text-gray-500 font-medium block mb-1">${t.selectSize}</label>
                                <select id="sizeSelect-${p.id}" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-1.5 px-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                    ${p.sizes.map(s => `<option value="${s}">${t.sizeText} ${s}</option>`).join('')}
                                </select>
                            </div>

                            <div class="mt-auto">
                                <button onclick="toggleAddToCart(${p.id})" id="btnCart-${p.id}" class="w-full ${isInCart ? 'bg-green-600 hover:bg-green-700' : 'bg-gray-900 hover:bg-indigo-600'} text-white text-sm font-medium py-2.5 rounded-xl transition shadow flex items-center justify-center space-x-2">
                                    <i class="fa-solid ${isInCart ? 'fa-check' : 'fa-plus'}"></i>
                                    <span>${isInCart ? t.addedBtn : t.addBtn}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleAddToCart(productId) {
            const product = products.find(p => p.id === productId);
            const index = cart.findIndex(item => item.product.id === productId);

            if (index > -1) {
                cart.splice(index, 1);
            } else {
                const sizeSelect = document.getElementById(`sizeSelect-${productId}`);
                const selectedSize = sizeSelect ? sizeSelect.value : product.sizes[0];
                cart.push({ product, selectedSize });
            }

            updateCartUI();
            renderProducts(getFilteredProducts());
        }

        function updateCartUI() {
            const count = cart.length;
            const t = translations[currentLang];
            document.getElementById('cartCountBadge').innerText = count;
            document.getElementById('mobileCartCount').innerText = `${count} шт.`;
            
            const list = document.getElementById('cartItemsList');
            if (count === 0) {
                list.innerHTML = `<p class="text-center text-gray-400 py-8 text-sm">${t.emptyCart}</p>`;
                document.getElementById('sendBulkBtn').disabled = true;
                document.getElementById('sendBulkBtn').classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                document.getElementById('sendBulkBtn').disabled = false;
                document.getElementById('sendBulkBtn').classList.remove('opacity-50', 'cursor-not-allowed');
                
                list.innerHTML = cart.map((item, i) => `
                    <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <div class="flex items-center space-x-3">
                            <img src="${item.product.image}" class="w-12 h-12 object-cover rounded-lg" onerror="this.src='https://via.placeholder.com/50'">
                            <div>
                                <h4 class="text-xs font-bold text-gray-800 line-clamp-1">${item.product.name[currentLang]}</h4>
                                <span class="text-xs text-indigo-600 font-semibold">${t.sizeText}: ${item.selectedSize}</span>
                            </div>
                        </div>
                        <button onclick="toggleAddToCart(${item.product.id})" class="text-red-400 hover:text-red-600 p-1">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `).join('');
            }
        }

        function toggleCartModal() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        function sendBulkEmail() {
            if (cart.length === 0) return;
            const t = translations[currentLang];

            const subject = encodeURIComponent(`${t.mailSubject} (${cart.length} pos)`);
            let messageText = t.mailGreeting;
            
            cart.forEach((item, idx) => {
                messageText += `${idx + 1}. ${item.product.name[currentLang]}\n`;
                messageText += `   — ${t.sizeText}: ${item.selectedSize}\n`;
                messageText += `   — Photo: ${item.product.image}\n\n`;
            });

            const body = encodeURIComponent(messageText);
            window.location.href = `mailto:${myEmail}?subject=${subject}&body=${body}`;
            toggleCartModal();
        }

        function filterCategory(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn px-4 py-2 bg-indigo-800/80 text-white font-medium rounded-xl text-sm whitespace-nowrap shadow hover:bg-indigo-700 transition";
            });
            btn.className = "cat-btn px-4 py-2 bg-white text-indigo-900 font-medium rounded-xl text-sm whitespace-nowrap shadow hover:bg-indigo-50 transition active";

            // Восстанавливаем переводы текста кнопок при клике
            const t = translations[currentLang];
            document.querySelectorAll('.cat-btn').forEach(b => {
                const c = b.getAttribute('data-cat');
                if (c === 'all') b.innerText = t.catAll;
                if (c === 'men') b.innerText = t.catMen;
                if (c === 'women') b.innerText = t.catWomen;
            });

            renderProducts(getFilteredProducts());
        }

        document.getElementById('searchInput').addEventListener('input', () => {
            renderProducts(getFilteredProducts());
        });

        // Инициализация при загрузке
        updateCartUI();
        renderProducts(products);
    </script>
</body>
</html>
